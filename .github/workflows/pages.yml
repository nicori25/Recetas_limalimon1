name: Publicar LimaLimón en GitHub Pages

on:
  push:
    branches: [feat/vue-supabase]
    paths-ignore:
      - 'documentacion/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar para la ruta del repositorio
        run: npm run build:pages
      - name: Instalar Chromium para comprobar el build
        run: npx playwright install --with-deps chromium
      - name: Verificar navegación, imágenes y retorno de Auth
        run: npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
